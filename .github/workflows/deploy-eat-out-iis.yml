name: Deploy Eat Out to IIS

on:
  push:
    branches:
      - main
    paths:
      - "eat-out/**"
      - ".github/workflows/deploy-eat-out-iis.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eat-out-iis-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Eat Out
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore eat-out/EatOut.Api/EatOut.Api.csproj
          if ($LASTEXITCODE -ne 0) { throw "Could not restore the Eat Out project." }
          dotnet publish eat-out/EatOut.Api/EatOut.Api.csproj --configuration Release --no-restore --output "$env:RUNNER_TEMP\EatOutPublish"
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the Eat Out project." }

      - name: Install Microsoft Web Deploy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install webdeploy --version=4.0.20260713 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Could not install Microsoft Web Deploy." }

      - name: Deploy to IIS
        shell: pwsh
        env:
          IIS_PUBLISH_SETTINGS: ${{ secrets.IIS_PUBLISH_SETTINGS }}
          EAT_OUT_SQL_CONNECTION_STRING: ${{ secrets.EAT_OUT_SQL_CONNECTION_STRING }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:IIS_PUBLISH_SETTINGS)) {
            throw "Add the IIS_PUBLISH_SETTINGS repository secret before deploying."
          }
          if ([string]::IsNullOrWhiteSpace($env:EAT_OUT_SQL_CONNECTION_STRING)) {
            throw "Add the EAT_OUT_SQL_CONNECTION_STRING repository secret before deploying."
          }

          [xml]$settings = $env:IIS_PUBLISH_SETTINGS
          $profile = @($settings.publishData.publishProfile) |
            Where-Object { $_.publishMethod -in @("MSDeploy", "WebDeploy") } |
            Select-Object -First 1
          if (-not $profile) {
            throw "IIS_PUBLISH_SETTINGS must contain an IIS Web Deploy publish profile."
          }
          foreach ($attribute in @("publishUrl", "msdeploySite", "userName", "userPWD")) {
            if ([string]::IsNullOrWhiteSpace($profile.$attribute)) {
              throw "The Web Deploy publish profile is missing the $attribute attribute."
            }
          }

          $connection = [System.UriBuilder]::new(
            $(if ($profile.publishUrl -match "^https?://") { $profile.publishUrl } else { "https://$($profile.publishUrl)" })
          )
          if ($connection.Path -notmatch "msdeploy\.axd$") {
            if ($connection.Port -eq 443 -or $connection.Port -eq -1) { $connection.Port = 8172 }
            $connection.Path = "/msdeploy.axd"
            $connection.Query = "site=$([uri]::EscapeDataString($profile.msdeploySite))"
          }

          $webConfigPath = Join-Path "$env:RUNNER_TEMP\EatOutPublish" "web.config"
          [xml]$webConfig = Get-Content -LiteralPath $webConfigPath -Raw
          $aspNetCore = $webConfig.SelectSingleNode("/configuration/system.webServer/aspNetCore")
          if (-not $aspNetCore) { throw "The published IIS web.config has no aspNetCore configuration." }
          $environmentVariables = $aspNetCore.SelectSingleNode("environmentVariables")
          if (-not $environmentVariables) {
            $environmentVariables = $webConfig.CreateElement("environmentVariables")
            [void]$aspNetCore.AppendChild($environmentVariables)
          }
          $connectionVariable = $environmentVariables.SelectSingleNode("environmentVariable[@name='EAT_OUT_SQL_CONNECTION_STRING']")
          if (-not $connectionVariable) {
            $connectionVariable = $webConfig.CreateElement("environmentVariable")
            $connectionVariable.SetAttribute("name", "EAT_OUT_SQL_CONNECTION_STRING")
            [void]$environmentVariables.AppendChild($connectionVariable)
          }
          $connectionVariable.SetAttribute("value", $env:EAT_OUT_SQL_CONNECTION_STRING)
          $webConfig.Save($webConfigPath)

          $msdeploy = @(
            "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "C:\Program Files\IIS\Microsoft Web Deploy V4\msdeploy.exe",
            "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "C:\Program Files (x86)\IIS\Microsoft Web Deploy V4\msdeploy.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $msdeploy) { throw "Microsoft Web Deploy was installed but msdeploy.exe could not be found." }

          $source = '-source:contentPath="{0}"' -f "$env:RUNNER_TEMP\EatOutPublish"
          $destination = '-dest:contentPath="{0}",ComputerName="{1}",UserName="{2}",Password="{3}",AuthType=Basic' -f `
            $profile.msdeploySite, $connection.Uri.AbsoluteUri, $profile.userName, $profile.userPWD
          $deployOutput = & $msdeploy "-verb:sync" $source $destination "-enableRule:AppOffline" 2>&1
          if ($LASTEXITCODE -ne 0) {
            $message = $deployOutput -join [Environment]::NewLine
            foreach ($secret in @($env:IIS_PUBLISH_SETTINGS, $env:EAT_OUT_SQL_CONNECTION_STRING, $profile.userPWD)) {
              if (-not [string]::IsNullOrEmpty($secret)) {
                $message = $message.Replace($secret, "[REDACTED]")
              }
            }
            Write-Error "IIS deployment failed. $message"
          }
          Write-Host "Eat Out was deployed to IIS successfully."
